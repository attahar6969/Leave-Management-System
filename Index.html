<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><?= company ?></title>
<style>
:root{--navy:#0f3d5e;--navy2:#165a8a;--bg:#f2f5f9;--line:#dbe3ec;--txt:#1f2d3a;--mut:#667788;--ok:#1b8a4b;--okb:#e4f5ea;--warn:#a86a00;--warnb:#fff3d6;--bad:#c0392b;--badb:#fdeaea;--gry:#6b7785;--gryb:#eceff3}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit}
#boot{padding:40px;text-align:center;color:var(--mut)}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;height:54px}
.brand{font-weight:700;font-size:16px;flex:1}.brand small{display:block;font-weight:400;font-size:11px;opacity:.8}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.chip{background:rgba(255,255,255,.18);padding:2px 8px;border-radius:10px;font-size:11px}
.burger{display:none;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.lay{display:flex;min-height:calc(100vh - 54px)}
nav#nav{width:220px;background:#fff;border-right:1px solid var(--line);padding:10px 0;flex-shrink:0}
nav#nav a{display:block;padding:10px 18px;color:var(--txt);cursor:pointer;border-left:3px solid transparent}
nav#nav a:hover{background:var(--bg)}nav#nav a.on{background:#e8f0f8;border-left-color:var(--navy);color:var(--navy);font-weight:600}
nav#nav .sep{height:1px;background:var(--line);margin:8px 14px}
@media(min-width:761px){
  nav#nav{position:sticky;top:54px;align-self:flex-start;height:calc(100vh - 54px);overflow-y:auto}
}
main{flex:1;padding:20px;min-width:0}
h2{margin:0 0 14px;color:var(--navy);font-size:20px}h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat{background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:24px;color:var(--navy)}.stat span{color:var(--mut);font-size:12px}
.stat.a{border-left-color:#e0a100}.stat.g{border-left-color:var(--ok)}.stat.r{border-left-color:var(--bad)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#eaf0f6;color:var(--navy);text-align:left;padding:8px 10px;white-space:nowrap}td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:#fafcfe}.num{text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.b-PENDING{background:var(--warnb);color:var(--warn)}.b-APPROVED,.b-Active,.b-Paid{background:var(--okb);color:var(--ok)}.b-REJECTED,.b-Inactive{background:var(--badb);color:var(--bad)}.b-CANCELLED,.b-Pending,.b-Processed{background:var(--gryb);color:var(--gry)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:5px;padding:9px 16px;cursor:pointer;font-weight:600}.btn:hover{background:var(--navy2)}
.btn.sm{padding:5px 10px;font-size:12px}.btn.ghost{background:transparent;border:1px solid currentColor;color:var(--navy)}.top .btn.ghost{color:#fff}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.gr{background:var(--gry)}.btn:disabled{opacity:.6;cursor:wait}
label.l{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}.hint{color:var(--mut);font-size:12px;margin-top:3px}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:9px 10px;border:1px solid #b9c6d4;border-radius:5px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc4e4;border-color:var(--navy2)}input:disabled,select:disabled{background:#eef1f5}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}.bar>div{min-width:130px}
.msg{padding:9px 12px;border-radius:5px;margin:10px 0;font-size:13px}.msg.e{background:var(--badb);color:var(--bad)}.msg.o{background:var(--okb);color:var(--ok)}.msg.i{background:#e8f0f8;color:var(--navy)}.msg.w{background:var(--warnb);color:var(--warn)}
.login{min-height:100vh;display:flex}.lbrand{flex:1;background:linear-gradient(160deg,var(--navy),#0b2a43);color:#fff;padding:60px 48px;display:flex;flex-direction:column;justify-content:center}
.lbrand h1{margin:0 0 8px;font-size:30px}.lbrand p{opacity:.85;max-width:380px;line-height:1.5}
.lform{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff}.lbox{width:100%;max-width:380px}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:16px}.tabs a{flex:1;text-align:center;padding:10px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}.tabs a.on{color:var(--navy);border-bottom-color:var(--navy)}
.lnk{color:var(--navy2);cursor:pointer;font-size:13px;text-decoration:underline;background:none;border:0;padding:0}
.hb{display:flex;align-items:center;gap:8px;margin:5px 0}.hb span.t{width:110px;font-size:12px;color:var(--mut)}.hb i{display:block;height:14px;border-radius:3px;background:var(--navy2);min-width:2px}.hb em{font-style:normal;font-size:12px}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}.cols div.c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:10px;color:var(--mut)}
.cols div.c i{display:block;width:100%}.leg{font-size:12px;margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;border-radius:2px}
.cCL{background:#165a8a}.cSL{background:#e0a100}.cOTHER{background:#7d5ba6}
.pv{margin:10px 0;min-height:20px}.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}.kv b{color:var(--mut);font-weight:600}
#toast{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px}.tst{background:var(--ok);color:#fff;padding:11px 16px;border-radius:6px;box-shadow:0 3px 10px rgba(0,0,0,.2);max-width:360px}.tst.bad{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(10,25,40,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.md{background:#fff;border-radius:8px;width:100%;max-width:760px;box-shadow:0 8px 30px rgba(0,0,0,.3)}.md.s{max-width:520px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:#f6f9fc;border-radius:8px 8px 0 0}.mh b{color:var(--navy);font-size:16px}.mb{padding:16px 18px}.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut)}.ld{padding:30px;text-align:center;color:var(--mut)}.mut{color:var(--mut)}.sec{border:1px dashed #c3cfdb;border-radius:6px;padding:8px 12px;margin-top:12px;background:#fbfcfe}
@media(max-width:760px){.burger{display:block}.who .nm{display:none}nav#nav{position:fixed;top:54px;left:-240px;bottom:0;z-index:30;transition:left .2s;width:230px}nav#nav.open{left:0;box-shadow:4px 0 14px rgba(0,0,0,.2)}main{padding:12px}.lbrand{display:none}.kv{grid-template-columns:1fr}}

.ecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ec{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.ec-h{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:#e8f0f8;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.ec-n{flex:1;min-width:0}.ec-n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ec-n small{color:var(--mut)}
.ec-t{text-align:center;background:var(--badb);color:var(--bad);border-radius:8px;padding:4px 12px}.ec-t b{display:block;font-size:22px;line-height:1.2}.ec-t span{font-size:10px}
.ec-s{margin:14px 0 6px;font-size:12px;color:var(--mut);font-weight:600}
.ec-g3,.ec-g2,.ec-g1{display:grid;gap:8px}.ec-g3{grid-template-columns:repeat(3,1fr)}.ec-g2{grid-template-columns:repeat(2,1fr)}.ec-g1{grid-template-columns:1fr}
.ec-x{border-radius:8px;padding:8px 4px;text-align:center;background:#f2f5f9}
.ec-x span{display:block;font-size:11px;color:var(--mut)}.ec-x b{font-size:18px;color:var(--txt)}
.ec-x small{display:block;font-size:11px;margin-top:2px;color:inherit}
.ec-x.rm small{color:var(--ok)}
.ec-x.cl{background:#e3eef8}.ec-x.cl span,.ec-x.cl b{color:#165a8a}
.ec-x.lp{background:var(--badb)}.ec-x.lp span,.ec-x.lp b{color:var(--bad)}
.ec-x.sl{background:var(--warnb)}.ec-x.sl span,.ec-x.sl b{color:var(--warn)}
.ec-x.rm{background:var(--okb)}.ec-x.rm span,.ec-x.rm b{color:var(--ok)}
.ec-x.ot{background:#efe7f7}.ec-x.ot span,.ec-x.ot b{color:#6a4a94}
.ec-na{background:var(--gryb);border:1px dashed #b9c6d4;border-radius:8px;padding:10px;text-align:center;color:var(--gry);font-size:13px}
.ec-b{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#eceff3;margin-top:14px}.ec-b i{display:block;height:100%}


.mw{margin-bottom:16px}
.mw-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 14px}
.mw-sum div{background:#f2f5f9;border-radius:8px;padding:8px;text-align:center}
.mw-sum span{display:block;font-size:11px;color:var(--mut)}.mw-sum b{font-size:18px;color:var(--navy)}
.mw-r{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
.mw-r.cur{border:2px solid var(--navy2);background:#e8f0f8}
.mw-r.mut{background:#f6f8fb;border-color:transparent}
.mw-m{width:44px;font-weight:700;font-size:14px;color:var(--navy)}
.mw-c{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.mw-ch{font-size:12px;padding:2px 9px;border-radius:10px;background:#eceff3;color:var(--gry)}
.mw-ch.cr{background:var(--okb);color:var(--ok)}.mw-ch.us{background:#e3eef8;color:#165a8a}
.mw-ch.lp{background:var(--badb);color:var(--bad)}.mw-ch.ad{background:var(--warnb);color:var(--warn)}
.mw-no{font-size:12px;color:#9aa7b4}
.mw-tag{font-size:11px;background:var(--navy2);color:#fff;padding:1px 9px;border-radius:10px}
.mw-cl{width:62px;text-align:right}.mw-cl span{display:block;font-size:10px;color:var(--mut)}.mw-cl b{font-size:18px;color:var(--navy)}
@media(max-width:760px){.mw-sum{grid-template-columns:repeat(2,1fr)}}
/* ===== MOBILE / TOUCH FIXES ===== */
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;display:none;background:linear-gradient(90deg,#e0a100,#165a8a,#e0a100);background-size:200% 100%;animation:pg 1s linear infinite}
@keyframes pg{to{background-position:-200% 0}}
html{-webkit-text-size-adjust:100%}
button,a,[data-a],select,label,input{touch-action:manipulation;-webkit-tap-highlight-color:rgba(15,61,94,.15)}
[data-a]{cursor:pointer}
.btn{min-height:40px}
main > p{display:flex;flex-wrap:wrap;gap:10px}
.burger{min-width:44px;min-height:44px}
@media(max-width:760px){
  input,select,textarea{font-size:16px}
  .btn{min-height:44px}
  .btn.sm{min-height:38px;padding:7px 12px}
  nav#nav a{padding:14px 18px}
  .bar>div{flex:1 1 45%;min-width:0}
  .bar>div:last-child{flex-basis:100%}
  .row>*{min-width:100%}
  /* tables become cards */
  .stk table,.stk tbody,.stk tr,.stk td{display:block;width:100%}
  .stk tr:first-child{display:none}
  .stk tr{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:6px 10px;background:#fff}
  .stk td{border:0;padding:4px 0;display:flex;gap:10px;justify-content:space-between;text-align:right}
  .stk td::before{content:attr(data-label);font-weight:600;color:var(--mut);text-align:left;flex:0 0 38%}
  .stk td[data-label=""]::before{display:none}
  .stk td[data-label=""]{justify-content:flex-end}
  .stk td:empty{display:none}
  .ov{padding:0}.md{border-radius:0;min-height:100%;max-width:100%!important}
}

/* ===== LOGIN BRANDING ===== */
.lgo{width:110px;height:110px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:20px;flex-shrink:0}
.lgo img{width:100%;height:100%;object-fit:contain;display:block}
.lgo b{font-size:36px;color:var(--navy)}
.lfeat{list-style:none;margin:22px 0 0;padding:0}
.lfeat li{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:14px;opacity:.92}
.lfeat span{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
@media(max-width:760px){
  body:has(.login){background:var(--bg)}
  .login{flex-direction:column}
  .login{min-height:100vh;min-height:100dvh}
  .lbrand{display:flex;flex:none;flex-direction:row;align-items:center;gap:14px;padding:22px 18px}
  .lbrand .lgo{width:64px;height:64px;margin:0;border-radius:12px}
  .lbrand h1{font-size:20px;margin:0}
  .lbrand p{font-size:12px;margin:4px 0 0;max-width:none;line-height:1.4}
  .lfeat{display:none}
  .lform{flex:1;align-items:center;justify-content:center;background:transparent;padding:20px 14px 90px;margin-top:0}
  .lbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
}

/* ===== COMPANY NAME (normal font) + clean mobile header ===== */
.lbrand h1,.top .brand{
  font-family:"Segoe UI",Roboto,Arial,sans-serif;
  font-weight:700;
  color:#fff;
  letter-spacing:0;
}
.top .brand{min-width:0;line-height:1.2}
.top .brand small{font-weight:400;letter-spacing:0}

@media(max-width:760px){
  .top{gap:8px;padding:0 10px}
  .top .brand{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .brand small{font-size:10px;overflow:hidden;text-overflow:ellipsis}
  .who{gap:6px;flex-shrink:0}
  .who .chip{display:none}
  .top .btn.sm{padding:6px 12px;min-height:36px}
  .burger{min-width:40px}
}

/* ===== LEAVE POLICY POPUP ===== */
.md.pol .mb{max-height:62vh;overflow:auto}
.md.pol .mf{justify-content:space-between;align-items:center}
.pol-c{margin:0;flex:1 1 auto;align-items:flex-start}
@media(max-width:760px){
  .md.pol{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .md.pol .mb{flex:1 1 auto;max-height:none;min-height:0;-webkit-overflow-scrolling:touch}
  .md.pol .mf{flex-direction:column;align-items:stretch;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
  .md.pol .mf .btn{width:100%}
}

/* ===== COLLAPSIBLE SECTIONS ===== */
.cs{padding:0;overflow:hidden}
.cs .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;-webkit-user-select:none}
.cs .ch h3{margin:0}
.cs .ar{font-size:20px;color:var(--mut);line-height:1;transition:transform .2s}
.cs.open .ar{transform:rotate(180deg)}
.cs .cbd{display:none;padding:14px 16px 16px;border-top:1px solid var(--line)}
.cs.open .cbd{display:block}
.cs .cbd .grid .card{margin-bottom:0}
/* ===== RUNNING MESSAGE (ON LEAVE TODAY) ===== */
.tick{display:flex;align-items:stretch;background:#0f3d5e;border-radius:8px;overflow:hidden;height:52px;margin:14px 0 16px}
.tick .tl{display:flex;align-items:center;gap:9px;background:#0b2a43;padding:0 16px;flex-shrink:0;border-right:3px solid #e0a100}
.tick .tl b{color:#fff;font-size:13px;font-weight:600;letter-spacing:.6px;white-space:nowrap}
.tick .dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;animation:tkpulse 1.4s ease-in-out infinite}
@keyframes tkpulse{0%,100%{opacity:1}50%{opacity:.25}}
.tick .tm{flex:1;overflow:hidden;display:flex;align-items:center;white-space:nowrap}
.tick .in{display:inline-flex;align-items:center;gap:26px;padding-left:100%;animation:tkscroll 14s linear infinite}
.tick .tm:hover .in{animation-play-state:paused}
@keyframes tkscroll{to{transform:translateX(-100%)}}
.tick .pp{display:inline-flex;align-items:center;gap:9px}
.tick .av{width:28px;height:28px;border-radius:50%;background:#e8f0f8;color:#0f3d5e;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tick .nm{color:#fff;font-size:14px;font-weight:600}
.tick .ty{font-size:11px;background:#e0a100;color:#3a2900;padding:2px 9px;border-radius:10px;font-weight:600}
.tick .sp{color:#5d8bb0;font-size:16px}
.tick .ct{display:flex;align-items:center;gap:6px;padding:0 16px;background:#0b2a43;color:#fff;font-size:13px;flex-shrink:0}
.tick .ct b{background:#e0a100;color:#3a2900;border-radius:10px;padding:1px 9px}
.tick.none .tl{border-right-color:#3ddc84}
.tick.none .dot{animation:none}
.tick.none .ct b{background:#3ddc84;color:#06361a}
.tick .none-t{flex:1;display:flex;align-items:center;padding:0 16px;color:#fff;font-size:14px}
@media(max-width:760px){.tick .tl{padding:0 10px}.tick .tl b{font-size:11px}.tick .ct{display:none}}

/* numeric headers line up with their numbers */
th.num{text-align:right}
td.num,th.num{white-space:nowrap;padding-right:14px}
.md .mw{margin-bottom:14px}
.md td{vertical-align:middle}
/* centered data tables (Balances & Diwali Bonus) */
@media(min-width:761px){
  .cn th,.cn td{vertical-align:middle;text-align:center}
  .cn th:first-child,.cn td:first-child{text-align:left}
  .cn.bn th:nth-child(8),.cn.bn td:nth-child(8){text-align:left}   /* Remarks in Diwali table */
  .cn td{padding-top:12px;padding-bottom:12px}
  .cn td.num,.cn th.num{text-align:center;padding-right:10px}
  .cn .btn.sm{min-width:84px}
}
.ec-g4{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
.ec-h .btn{flex-shrink:0}
.ec-m{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
.ec-m b{color:var(--txt)}
/* Balances & Bonus rows (same look as monthly cards) */
.mw-n{display:flex;align-items:center;gap:10px;width:210px;flex-shrink:0;min-width:0}
.mw-n b{display:block;color:var(--navy)}.mw-n small{color:var(--mut)}
.mw-n .av{width:38px;height:38px;font-size:13px}
.mw-c.col{flex-direction:column;align-items:flex-start;gap:6px}
.mw-l{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mw-lb{width:26px;font-size:11px;font-weight:700;color:var(--mut)}
.mw-ch.bal{background:var(--okb);color:var(--ok);font-weight:700}
.mw-ch.am{background:var(--okb);color:var(--ok);font-weight:700}
.mw-ch.el{background:#e3eef8;color:#165a8a;font-weight:700}
.b-Pending{background:var(--warnb);color:var(--warn)}
@media(max-width:760px){.mw-r{flex-wrap:wrap}.mw-n{width:100%}}

/* Employees: corporate directory */
.ep-sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.ep-st{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:6px;padding:10px 14px}
.ep-st span{display:block;font-size:11px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.ep-st b{font-size:22px;color:var(--navy)}

<body data-company="<?= company ?>">
<div id="prog"></div>
<div id="boot">Loading...</div>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
(function () {
'use strict';
var CO = document.body.getAttribute('data-company') || 'Attahar Web-Portal';
var LT = { CL: 'Casual Leave', SL: 'Sick Leave', OTHER: 'Other Leave' };
var S = { role: null, token: null, user: null, cfg: {}, tab: 'emp', view: 'login', emps: [], df: {}, otp: false };
var H = {}, PG = {}, CHG = {};

function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function v(id) { var e = document.getElementById(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : ''; }
function fd(s) { return s ? String(s).split('-').reverse().join('/') : ''; }
function main(h) { $('#main').innerHTML = h; }
function loader() { main('<div class="ld">Loading...</div>'); }
function badge(s) { return '<span class="badge b-' + esc(s) + '">' + esc(s) + '</span>'; }
function toast(m, bad) { var d = document.createElement('div'); d.className = 'tst' + (bad ? ' bad' : ''); d.textContent = m; $('#toast').appendChild(d); setTimeout(function () { d.remove(); }, bad ? 6500 : 3500); }
function opts(list, sel, blank) { var h = blank ? '<option value="">' + esc(blank) + '</option>' : ''; list.forEach(function (o) { var val = o[0], lab = o[1]; h += '<option value="' + esc(val) + '"' + (String(val) === String(sel) ? ' selected' : '') + '>' + esc(lab) + '</option>'; }); return h; }
function empOpts(sel, blank, onlyActive) { return opts(S.emps.filter(function (e) { return !onlyActive || e.status === 'Active'; }).map(function (e) { return [e.id, e.name + ' (' + e.id + ')']; }), sel, blank); }
function typeOpts(sel, blank) { return opts([['CL', 'Casual Leave'], ['SL', 'Sick Leave'], ['OTHER', 'Other Leave']], sel, blank); }
function tbl(heads, rows, empty, stack) { if (!rows.length) return '<div class="ld">' + esc(empty || 'No records found.') + '</div>'; return '<div class="tw' + (stack ? ' stk' : '') + '"><table><tr>' + heads.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>' + rows.join('') + '</table></div>'; }
function labelCells(root) {
  $$('.stk table', root).forEach(function (t) {
    var hs = $$('th', t).map(function (h) { return h.textContent; });
    $$('tr', t).forEach(function (r) { $$('td', r).forEach(function (c, i) { c.setAttribute('data-label', hs[i] || ''); }); });
  });
  $$('table', root).forEach(function (t) {
    var rows = $$('tr', t); if (rows.length < 2) return;
    var ths = $$('th', rows[0]), tds = $$('td', rows[1]);
    ths.forEach(function (h, i) { if (tds[i] && tds[i].classList.contains('num')) h.classList.add('num'); });
  });
}
new MutationObserver(function () { labelCells(document); }).observe(document.body, { childList: true, subtree: true });
function fld(label, html, hint) { return '<label class="l">' + label + '</label>' + html + (hint ? '<div class="hint">' + hint + '</div>' : ''); }

/* ---------- server calls ---------- */
var busy = 0;
function bump(n) { busy = Math.max(0, busy + n); var b = document.getElementById('prog'); if (b) b.style.display = busy > 0 ? 'block' : 'none'; }
function call(kind, action, payload) {
  return new Promise(function (res, rej) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) { rej(new Error('This page must be opened from the deployed Web App link (ending in /exec).')); return; }
    var done = false;
    bump(1);
    var timer = setTimeout(function () { if (done) return; done = true; bump(-1); rej(new Error('The server is taking too long. Please check your internet and try again.')); }, 45000);
    function fin() { if (done) return false; done = true; clearTimeout(timer); bump(-1); return true; }
    var r = google.script.run
      .withSuccessHandler(function (x) { if (!fin()) return; if (!x) { rej(new Error('No response from the server.')); return; } if (x.ok) res(x.data); else { var e = new Error(x.error); e.code = x.code; rej(e); } })
      .withFailureHandler(function (e) { if (!fin()) return; rej(new Error(e && e.message ? e.message : 'Server error. Please try again.')); });
    if (kind === 'pub') r.apiPublic(action, payload || {}); else if (kind === 'emp') r.apiEmployee(action, S.token, payload || {}); else r.apiAdmin(action, S.token, payload || {});
  });
}
/* drop answers that arrive after the user has already moved to another page */
function fresh(p) {
  var pg = S.page;
  return new Promise(function (res, rej) {
    p.then(function (v) { if (S.page === pg) res(v); },
           function (e) { if (S.page === pg || e.code === 'AUTH') rej(e); });
  });
}
function P(a, p) { return call('pub', a, p); }
function E(a, p) { return fresh(call('emp', a, p)); }
function A(a, p) { return fresh(call('adm', a, p)); }
function run(btn, fn) {
  var t = btn ? btn.textContent : ''; if (btn) { btn.disabled = true; btn.textContent = 'Please wait...'; }
  return Promise.resolve().then(fn).catch(function (e) { if (e.code === 'AUTH') signOut(e.message); else toast(e.message, true); }).then(function (r) { if (btn) { btn.disabled = false; btn.textContent = t; } return r; });
}

/* ---------- events (touch-friendly) ---------- */
function fire(e) {
  var b = e.target.closest && e.target.closest('[data-a]');
  var nav = $('#nav');
  if (nav && !e.target.closest('#nav') && !e.target.closest('.burger')) nav.classList.remove('open');
  if (!b || b.disabled) return false;
  var f = H[b.getAttribute('data-a')];
  if (!f) return false;
  e.preventDefault(); f(b.dataset, b); return true;
}
var tStart = null, lastTouch = 0;
document.addEventListener('touchstart', function (e) { var t = e.touches[0]; tStart = { x: t.clientX, y: t.clientY }; }, { passive: true });
document.addEventListener('touchend', function (e) {
  if (!tStart) return;
  var t = e.changedTouches[0], moved = Math.abs(t.clientX - tStart.x) > 10 || Math.abs(t.clientY - tStart.y) > 10;
  tStart = null;
  if (!moved && fire(e)) lastTouch = Date.now();   // preventDefault stops the duplicate click
});
document.addEventListener('click', function (e) {
  if (Date.now() - lastTouch < 700) return;        // already handled by touchend
  fire(e);
});
document.addEventListener('change', function (e) { var b = e.target.closest('[data-ch]'); if (b && CHG[b.getAttribute('data-ch')]) CHG[b.getAttribute('data-ch')](b); });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !e.target.matches('input:not([type=checkbox]):not([type=file]):not([type=date])')) return;
  var f = e.target.closest('[data-enter]'); if (f) { var b = $('[data-a="' + f.getAttribute('data-enter') + '"]', f); if (b) b.click(); }
});
window.addEventListener('error', function (e) { toast('Unexpected error: ' + e.message, true); });

/* ---------- modal ---------- */
function modal(title, body, foot, small) {
  $('#modal').innerHTML = '<div class="ov"><div class="md' + (small ? ' s' : '') + '"><div class="mh"><b>' + esc(title) + '</b><button class="x" data-a="mclose">&times;</button></div><div class="mb">' + body + '</div>' + (foot ? '<div class="mf">' + foot + '</div>' : '') + '</div></div>';
}
function closeModal() { $('#modal').innerHTML = ''; }
H.mclose = closeModal;
/* ---------- leave policy ---------- */
function policyHtml() {
  return '<div class="msg i"><b>Leave Policy</b><ul style="margin:6px 0 0;padding-left:18px;line-height:1.6">' +
    '<li>Har saal 12 paid leaves, 8 public holidays aur 12 paid sick leaves milti hain.</li>' +
    '<li>12 paid leaves: 1-2 din ki leave par <b>2 din ka notice</b>, 2 din se zyada leave par <b>1 hafte ka notice</b> dena zaroori hai.</li>' +
    '<li>Sick leave ke liye <b>doctor ka certificate compulsory</b> hai.</li></ul></div>' +
    '<div class="msg w"><b>Penalty Rules (unauthorised / unapproved leave)</b><ul style="margin:6px 0 0;padding-left:18px;line-height:1.6">' +
    '<li>1st aisi leave par: 1 din ki salary ka deduction + Rs 800 penalty.</li>' +
    '<li>2nd aisi leave par: 1 din ki salary ka deduction + Rs 1000 penalty.</li>' +
    '<li>3rd aisi leave par: 1 din ki salary ka deduction + Rs 1500 penalty.</li>' +
    '<li>3 ya usse zyada continuous unauthorised leave ki situation me company service terminate kar sakti hai.</li></ul></div>' +
    '<div class="msg i"><b>Important:</b> Leave possible ho to hamesha pehle se apply karein. Bina bataye ya last moment pe baar-baar chhutti lene par salary deduction ya doosri penalty lag sakti hai. Galat reason dena, ya sick leave ke liye proof na dene par bhi action ho sakta hai. Is form ko submit karke aap confirm karte ho ki saari details sahi hain.</div>';
}
function penCard(list) {
  return '<div class="card"><h3>My Unauthorized Leave / Penalty Record</h3>' + tbl(['Incident', 'Dates', 'Days', 'Occurrence', 'Salary deduction (days)', 'Penalty (Rs)', 'Remarks'], (list || []).map(function (u) {
    return '<tr><td>' + esc(u.id) + '</td><td>' + esc(u.from) + (u.from !== u.to ? ' - ' + esc(u.to) : '') + '</td><td class="num">' + u.duration + '</td><td class="num">' + u.occ + '</td><td class="num">' + u.salary + '</td><td class="num">' + u.penalty + '</td><td>' + esc(u.remarks) + '</td></tr>';
  }), 'No unauthorized leave or penalty recorded. Keep it up!', true) + '</div>';
}
function showPolicy() {
  modal('Leave Policy - please read', '<div class="pol-t">' + policyHtml() + '</div>', '<label class="hb pol-c"><input type="checkbox" id="pk" data-ch="pol"> <span><b>Maine leave policy padh li hai.</b></span></label><button class="btn" id="pb" data-a="polOk" disabled>Proceed</button>');
  var m = $('#modal .md'); if (m) m.classList.add('pol');
  var x = $('#modal .x'); if (x) x.style.display = 'none';
}
CHG.pol = function () { var b = $('#pb'); if (b) b.disabled = !v('pk'); };
H.polOk = function () { try { sessionStorage.setItem('kla', '1'); } catch (e) { } closeModal(); E('ackPolicy').catch(function () { }); };
function ask(msg, label, cls) {
  return new Promise(function (res) {
    modal('Please confirm', '<p>' + esc(msg) + '</p>', '<button class="btn gr" data-a="cNo">No</button><button class="btn ' + (cls || '') + '" data-a="cYes">' + esc(label || 'Yes, continue') + '</button>', true);
    H.cNo = function () { closeModal(); res(false); }; H.cYes = function () { closeModal(); res(true); };
  });
}

/* ---------- session ---------- */
function save() { try { sessionStorage.setItem('kl', JSON.stringify({ role: S.role, token: S.token, user: S.user, cfg: S.cfg })); } catch (e) { } }
function signOut(msg) {
  S.token = null; S.role = null; S.user = null; S.emps = []; S.df = {}; S.af = {}; S.page = null; loggingOut = false;
  try { sessionStorage.removeItem('kl'); } catch (e) { }
  closeModal(); S.view = 'login'; S.otp = false; login(msg);
}
var loggingOut = false;
H.logout = function (d, b) {
  if (loggingOut) return;
  loggingOut = true;
  if (b) { b.disabled = true; b.textContent = 'Signing out...'; }
  toast('Signing out...');
  var k = S.role === 'emp' ? 'emp' : 'adm';
  try { call(k, 'logout', {}).catch(function () { }); } catch (e) { }   // fire and forget, never wait for the server
  setTimeout(function () { loggingOut = false; signOut(); }, 400);
};
function begin(role, r) {
  S.role = role; S.token = r.token; S.user = role === 'emp' ? r.user : r.admin; S.cfg = r.config || {}; save(); shell();
  if (role === 'adm') A('listEmployees').then(function (l) { S.emps = l; }).catch(function () { });
  H.go({ p: role === 'emp' ? 'home' : 'dash' });
  if (role === 'emp') { try { sessionStorage.removeItem('kla'); } catch (e) { } showPolicy(); }
}

/* ---------- login ---------- */
var LOGO_URL = '<?!= logoDataUri_() ?>';
function logoHtml() {
  return LOGO_URL ? '<img src="' + LOGO_URL + '" alt="' + esc(CO) + '">' : '<b>A</b>';
}
function login(msg) {
  $('#toast').innerHTML = '';
  $('#boot').style.display = 'none';

function monthCards(t, title, note, kind, year) {
  var now = new Date(), cur = year === now.getFullYear() ? now.getMonth() : -1;
  var lapsName = kind === 'CL' ? 'Lapsed' : 'Expired';
  var cr = 0, us = 0, lp = 0;
  t.forEach(function (r) { cr += r.credit; us += r.used; lp += r.lapsed; });
  function r2(n) { return Math.round(n * 100) / 100; }
  var bal = t[cur >= 0 ? cur : 11].closing;
  function chip(label, val, cls, sign) { return '<span class="mw-ch ' + cls + '">' + label + ' ' + (sign || '') + val + '</span>'; }
  var rows = t.map(function (r, i) {
    var any = r.opening || r.credit || r.used || r.lapsed || r.adjust;
    var chips = '';
    if (r.opening) chips += chip('Opening', r.opening, '');
    if (r.credit) chips += chip('Credited', r.credit, 'cr', '+');
    if (r.used) chips += chip('Used', r.used, 'us', '-');
    if (r.lapsed) chips += chip(lapsName, r.lapsed, 'lp', '-');
    if (r.adjust) chips += chip('Adjust', r.adjust, 'ad', r.adjust > 0 ? '+' : '');
    if (!any) chips = '<span class="mw-no">' + (cur >= 0 && i > cur ? 'Upcoming' : 'No activity') + '</span>';
    if (i === cur) chips = '<span class="mw-tag">This month</span>' + chips;
    return '<div class="mw-r' + (i === cur ? ' cur' : (!any ? ' mut' : '')) + '"><div class="mw-m">' + r.month + '</div><div class="mw-c">' + chips + '</div><div class="mw-cl"><span>Closing</span><b>' + r.closing + '</b></div></div>';
  }).join('');
  return '<div class="card mw"><h3>' + title + '</h3>' + (note ? '<div class="hint" style="margin:-6px 0 0">' + note + '</div>' : '') +
    '<div class="mw-sum"><div><span>Credited</span><b>' + r2(cr) + '</b></div><div><span>Used</span><b>' + r2(us) + '</b></div><div><span>' + lapsName + '</span><b>' + r2(lp) + '</b></div><div><span>' + (kind === 'CL' ? 'Balance now' : 'Remaining') + '</span><b>' + bal + '</b></div></div>' + rows + '</div>';

function ctl(it) {
  var id = 's_' + it.key, dis = (it.locked || it.type === 'readonly') ? ' disabled' : '', val = String(it.value), base = ' id="' + id + '" data-k="' + it.key + '" data-o="' + esc(val) + '"' + dis;

  if (it.type.indexOf('select:') === 0) return '<select' + base + '>' + opts(it.type.slice(7).split('|').map(function (x) { return [x, x]; }), val) + '</select>';
  if (it.type === 'number') return '<input type="number" step="any"' + base + ' value="' + esc(val) + '">';

/* ---------------- finding things on the real page ---------------- */

function tgTxt(s, el) {

function tgPlace() {

function tgSpeak(text, tok, done) {
